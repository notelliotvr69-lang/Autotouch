name: QuestLink PC Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "questlink-pc/**"
      - ".github/workflows/questlink-pc.yml"

permissions:
  contents: write

jobs:
  build-pc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish QuestLink PC
        shell: pwsh
        run: |
          dotnet publish questlink-pc/QuestLink.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Download OpenComposite x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/opencomposite | Out-Null
          Invoke-WebRequest -Uri 'https://opencomposite.znix.xyz/builds/download_latest?branch=openxr&artefact_name=x64/openvr_api.dll' -OutFile 'dist/opencomposite/openvr_api.dll'
          if ((Get-Item 'dist/opencomposite/openvr_api.dll').Length -lt 100000) {
            throw 'OpenComposite download was unexpectedly small.'
          }

      - name: Stage PC build
        shell: pwsh
        run: |
          $stage = "dist/QuestLinkPC-v7.11"
          New-Item -ItemType Directory -Force -Path "$stage/opencomposite" | Out-Null

          Copy-Item "questlink-pc/bin/Release/net8.0-windows/win-x64/publish/QuestLinkPC.exe" "$stage/QuestLinkPC.exe"
          Copy-Item "dist/opencomposite/openvr_api.dll" "$stage/opencomposite/openvr_api.dll"

          @'
          QuestLink PC v7.11
          NO STEAMVR REQUIRED FOR GORILLA TAG.

          Gorilla Tag path:
          GTAG -vrmode openvr -> bundled OpenComposite -> QuestLink OpenXR runtime -> Quest client.

          QuestLink backs up Gorilla Tag's original openvr_api.dll before replacing it.
          '@ | Set-Content "$stage/README.txt"

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/QuestLinkPC-v7.11.zip" -Force

      - name: Upload PC build
        uses: actions/upload-artifact@v4
        with:
          name: QuestLinkPC-v7.11
          path: |
            dist/QuestLinkPC.exe
            dist/QuestLinkPC-v7.11.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "questlink-pc-v7.11"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "QuestLink PC v7.11" --notes "QuestLink PC v7.11 removes the SteamVR dependency for Gorilla Tag. It bundles OpenComposite and routes GTAG OpenVR calls directly into the QuestLink OpenXR runtime."
          }
          gh release upload $tag "dist/QuestLinkPC-v7.11.zip" --repo "${{ github.repository }}" --clobber
