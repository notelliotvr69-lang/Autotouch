name: QuestLink PC Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'questlink-pc/**'
      - '.github/workflows/questlink-pc.yml'
permissions:
  contents: write
jobs:
  build-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned compatibility compiler
        run: python -m pip install ziglang==0.16.0
      - name: Build compatibility DLL
        shell: pwsh
        run: python -m ziglang cc -target x86_64-windows-gnu -shared -nostdlib -O2 -DQUESTLINK_NO_CRT questlink-pc/compat/compat.c questlink-pc/compat/openvr_api.def -o openvr_api.dll
      - name: Publish and stage PC app
        shell: pwsh
        run: |
          $stage = 'dist/QuestLinkPC-v7.13-dev'
          dotnet publish questlink-pc/QuestLink.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $stage
          if ($LASTEXITCODE -ne 0) { throw 'PC build failed' }
          New-Item -ItemType Directory -Force "$stage/opencomposite" | Out-Null
          Invoke-WebRequest 'https://github.com/notelliotvr69-lang/Autotouch/releases/download/questlink-pc-v7.11/QuestLinkPC-v7.11.zip' -OutFile old-pc.zip
          Expand-Archive old-pc.zip old-pc
          $backend = Get-ChildItem old-pc -Recurse -Filter openvr_api.dll | Select-Object -First 1
          if ((Get-FileHash $backend.FullName).Hash -ne '827AD85F3606A4DC4A8F5561A8CA69E4C6C1B5D2B9CD3315A461B9270B08242C') { throw 'Unexpected OpenComposite backend' }
          Copy-Item $backend.FullName "$stage/opencomposite/opencomposite_backend.dll"
          Copy-Item openvr_api.dll "$stage/opencomposite/openvr_api.dll"
          Copy-Item questlink-pc/compat/README.md "$stage/COMPATIBILITY.md"
          Copy-Item questlink-pc/README-7.13.txt "$stage/README.txt"
          python questlink-pc/compat/test_exports.py "$stage/opencomposite"
          if ($LASTEXITCODE -ne 0) { throw 'DLL forwarding test failed' }
          Compress-Archive "$stage/*" dist/QuestLinkPC-v7.13-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuestLinkPC-v7.13-dev
          path: dist/QuestLinkPC-v7.13-dev.zip
          compression-level: 0
      - name: Publish development download
        if: github.ref == 'refs/heads/codex/quest3-wireless-vr'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'questlink-pc-v7.13-dev'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --repo '${{ github.repository }}' --prerelease --title 'QuestLink PC v7.13-dev' --notes 'Fixes the missing VRHeadsetView export that prevents the Unity OpenVR plugin from loading. Adds early game-exit detection. Experimental: headset gameplay remains to be verified. Use with Quest APK 7.13-dev and runtime 0.5-dev.'
          }
          gh release upload $tag dist/QuestLinkPC-v7.13-dev.zip --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
