name: QuestLink wireless development build
on:
  push:
    branches: [codex/quest3-wireless-vr]
  pull_request:
    paths: ['questlink-runtime/**', 'questlink-android/**', 'questlink-common/**', '.github/workflows/questlink-wireless-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S questlink-runtime -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/runtime -Force
          Copy-Item build/Release/QuestLinkOpenXRRuntime.dll dist/runtime/
          Copy-Item questlink-runtime/questlink_runtime.json dist/runtime/
          Copy-Item questlink-runtime/*.bat dist/runtime/
          Copy-Item questlink-runtime/tools dist/runtime/tools -Recurse
          Copy-Item questlink-runtime/WIRELESS-TESTING.md dist/runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: QuestLinkRuntime-v0.4-dev
          path: dist/runtime/
  quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - run: gradle --no-daemon assembleDebug
        working-directory: questlink-android
      - uses: actions/upload-artifact@v4
        with:
          name: QuestLinkClient-v7.12-dev
          path: questlink-android/app/build/outputs/apk/debug/app-debug.apk
