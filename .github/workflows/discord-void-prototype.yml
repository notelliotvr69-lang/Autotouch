name: Discord VOID Android prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "Discord-VOID-Prototype/**"
      - ".github/workflows/discord-void-prototype.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools, platforms;android-35, build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: Discord-VOID-Prototype
        run: gradle --no-daemon assembleDebug

      - name: Upload installable prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: Discord-VOID-prototype-debug-apk
          path: Discord-VOID-Prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
