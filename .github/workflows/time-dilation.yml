name: Time Dilation DLL
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - "TimeDilation/**"
      - ".github/workflows/time-dilation.yml"
      - "ULTRAKILL referenceZ 3.zip"
      - "UKReferenceZ.zip"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Prepare game references
        shell: pwsh
        run: |
          $required = @(
            @{ Name = "UnityEngine.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.dll" },
            @{ Name = "UnityEngine.CoreModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.CoreModule.dll" },
            @{ Name = "UnityEngine.InputLegacyModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.InputLegacyModule.dll" },
            @{ Name = "BepInEx.dll"; Destination = ".build/BepInEx/core/BepInEx.dll" }
          )
          $selected = $null
          foreach ($archive in @("ULTRAKILL referenceZ 3.zip", "UKReferenceZ.zip", "ULTRAKILL referenceZ 2.zip")) {
            if (!(Test-Path $archive)) { continue }
            $dir = Join-Path ".reference-extract" ([IO.Path]::GetFileNameWithoutExtension($archive))
            Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
            $ok = $true
            foreach ($f in $required) { if (@(Get-ChildItem $dir -Recurse -File -Filter $f.Name).Count -eq 0) { $ok = $false; break } }
            if ($ok) { $selected = $dir; break }
          }
          if (!$selected) { throw "No reference archive contains all required DLLs." }
          foreach ($f in $required) {
            $found = Get-ChildItem $selected -Recurse -File -Filter $f.Name | Select-Object -First 1
            New-Item -ItemType Directory -Force (Split-Path $f.Destination -Parent) | Out-Null
            Copy-Item $found.FullName $f.Destination -Force
          }
      - name: Build TimeDilation.dll
        run: dotnet build TimeDilation/TimeDilation.csproj --configuration Release
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: TimeDilation-DLL
          path: TimeDilation/bin/Release/netstandard2.1/TimeDilation.dll
          if-no-files-found: error
          retention-days: 14
