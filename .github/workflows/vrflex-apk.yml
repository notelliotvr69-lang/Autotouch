name: Build VRFlex APK

on:
  push:
    branches: [main]
    paths:
      - 'VRFlex/**'
      - '.github/workflows/vrflex-apk.yml'
  pull_request:
    paths:
      - 'VRFlex/**'
      - '.github/workflows/vrflex-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: VRFlex
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRFlex-debug-apk
          path: VRFlex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vrflex-latest
          name: VRFlex latest build
          prerelease: true
          make_latest: false
          files: VRFlex/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
