name: Build DualSense Rumble APK

on:
  push:
    branches: [ main, dualsense-rumble-app ]
    paths:
      - 'DualSenseRumble/**'
      - '.github/workflows/dualsense-rumble-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'DualSenseRumble/**'
      - '.github/workflows/dualsense-rumble-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: DualSenseRumble
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSense-Rumble-debug-APK
          path: DualSenseRumble/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
