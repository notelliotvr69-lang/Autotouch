name: Deploy QuestLink

on:
  push:
    branches: [ main ]
    paths:
      - 'questlink-android/**'
      - 'questlink-pc/**'
      - 'questlink-site/**'
      - '.github/workflows/questlink-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: questlink-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Quest APK
        working-directory: questlink-android
        run: gradle --no-daemon assembleDebug

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native Windows QuestLink PC
        run: dotnet publish questlink-pc/QuestLink.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Assemble website
        shell: bash
        run: |
          cp questlink-android/app/build/outputs/apk/debug/app-debug.apk questlink-site/QuestLinkClient.apk
          cp questlink-pc/bin/Release/net8.0-windows/win-x64/publish/QuestLinkPC.exe questlink-site/QuestLinkPC.exe
          test -f questlink-site/QuestLinkClient.apk
          test -f questlink-site/QuestLinkPC.exe
          ls -lh questlink-site/QuestLinkClient.apk questlink-site/QuestLinkPC.exe

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: questlink-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
