name: Deploy QuestLink
on:
  push:
    branches: [main]
    paths: ['questlink-site/**', '.github/workflows/questlink-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: questlink-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify development build provenance
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: 36653422410
            });
            if (run.conclusion !== 'success' || run.head_sha !== '91990945e861c2991328b0cf76427a35b0668663') {
              throw new Error('Expected successful, pinned wireless test build');
            }
      - name: Download verified Quest APK
        uses: actions/download-artifact@v4
        with:
          name: QuestLinkClient-v7.13-dev
          run-id: 36653422410
          github-token: ${{ github.token }}
          path: apk-download
      - name: Download matching runtime
        uses: actions/download-artifact@v4
        with:
          name: QuestLinkRuntime-v0.5-dev
          run-id: 36653422410
          github-token: ${{ github.token }}
          path: runtime-download
      - name: Assemble public downloads
        shell: bash
        run: |
          cp apk-download/app-debug.apk questlink-site/QuestLinkClient-v7.13-dev.apk
          (cd runtime-download && zip -qr ../questlink-site/QuestLinkRuntime-v0.5-dev.zip .)
          test -s questlink-site/QuestLinkClient-v7.13-dev.apk
          test -s questlink-site/QuestLinkRuntime-v0.5-dev.zip
          (cd questlink-site && sha256sum QuestLinkClient-v7.13-dev.apk QuestLinkRuntime-v0.5-dev.zip > SHA256SUMS.txt)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: questlink-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
