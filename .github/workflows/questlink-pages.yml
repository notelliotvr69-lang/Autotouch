name: Deploy QuestLink Website

on:
  push:
    branches: [ main ]
    paths:
      - 'questlink-site/**'
      - 'questlink-apk/**'
      - '.github/workflows/questlink-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: questlink-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode QuestLink Android project
        shell: bash
        run: |
          mkdir -p build-work
          base64 -d questlink-apk/QuestLinkAndroid_Source_v2.b64 > build-work/questlink-source.zip
          unzip -q build-work/questlink-source.zip -d build-work
          test -f build-work/QuestLinkAndroid_V0_8/settings.gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Quest APK
        working-directory: build-work/QuestLinkAndroid_V0_8
        run: gradle --no-daemon assembleDebug

      - name: Assemble website
        shell: bash
        run: |
          cp build-work/QuestLinkAndroid_V0_8/app/build/outputs/apk/debug/app-debug.apk questlink-site/QuestLinkClient.apk
          test -f questlink-site/index.html
          test -f questlink-site/QuestLinkClient.apk
          ls -lh questlink-site/QuestLinkClient.apk

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: questlink-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
