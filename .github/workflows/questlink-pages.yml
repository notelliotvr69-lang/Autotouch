name: Deploy QuestLink

on:
  push:
    branches: [ main ]
    paths:
      - 'questlink-android/**'
      - 'questlink-pc/**'
      - 'questlink-runtime/**'
      - 'questlink-site/**'
      - '.github/workflows/questlink-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: questlink-pages
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runtime
        shell: pwsh
        run: cmake -S questlink-runtime -B build/questlink-runtime -A x64

      - name: Build runtime
        shell: pwsh
        run: cmake --build build/questlink-runtime --config Release --parallel

      - name: Package runtime
        shell: pwsh
        run: |
          $stage = "dist/QuestLinkRuntime-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/tools" | Out-Null

          Copy-Item "build/questlink-runtime/Release/QuestLinkOpenXRRuntime.dll" "$stage/QuestLinkOpenXRRuntime.dll"
          Copy-Item "questlink-runtime/questlink_runtime.json" "$stage/questlink_runtime.json"
          Copy-Item "questlink-runtime/INSTALL_QUESTLINK_RUNTIME.bat" "$stage/INSTALL_QUESTLINK_RUNTIME.bat"
          Copy-Item "questlink-runtime/RESTORE_PREVIOUS_RUNTIME.bat" "$stage/RESTORE_PREVIOUS_RUNTIME.bat"
          Copy-Item "questlink-runtime/RUNTIME_STATUS.bat" "$stage/RUNTIME_STATUS.bat"
          Copy-Item "questlink-runtime/README.txt" "$stage/README.txt"
          Copy-Item "questlink-runtime/tools/Install-QuestLinkRuntime.ps1" "$stage/tools/Install-QuestLinkRuntime.ps1"
          Copy-Item "questlink-runtime/tools/Restore-PreviousRuntime.ps1" "$stage/tools/Restore-PreviousRuntime.ps1"

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/QuestLinkRuntime-Windows-x64-v0.3.zip" -Force

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: QuestLinkRuntime-Web
          path: dist/QuestLinkRuntime-Windows-x64-v0.3.zip
          if-no-files-found: error
          compression-level: 0

  build:
    runs-on: ubuntu-latest
    needs: build-runtime
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Quest APK
        working-directory: questlink-android
        run: gradle --no-daemon clean assembleDebug

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build QuestLink PC
        run: dotnet publish questlink-pc/QuestLink.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Download runtime package
        uses: actions/download-artifact@v4
        with:
          name: QuestLinkRuntime-Web
          path: runtime-download

      - name: Assemble website downloads
        shell: bash
        run: |
          cp questlink-android/app/build/outputs/apk/debug/app-debug.apk questlink-site/QuestLinkClient-v7.11.apk

          mkdir -p pc-package
          cp questlink-pc/bin/Release/net8.0-windows/win-x64/publish/QuestLinkPC.exe pc-package/QuestLinkPC.exe
          (cd pc-package && zip -q ../questlink-site/QuestLinkPC-v7.11.zip QuestLinkPC.exe)

          cp runtime-download/QuestLinkRuntime-Windows-x64-v0.3.zip questlink-site/QuestLinkRuntime-Windows-x64-v0.3.zip

          test -f questlink-site/QuestLinkClient-v7.10.apk
          test -f questlink-site/QuestLinkPC-v7.9.1.zip
          test -f questlink-site/QuestLinkRuntime-Windows-x64-v0.3.zip
          ls -lh questlink-site/QuestLinkClient-v7.10.apk questlink-site/QuestLinkPC-v7.9.1.zip questlink-site/QuestLinkRuntime-Windows-x64-v0.3.zip

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: questlink-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
