name: Build VRFlex Quest APK
on:
  push:
    branches: [main]
    paths:
      - 'VRFlex/**'
      - '.github/workflows/vrflex-quest-apk.yml'
  pull_request:
    paths:
      - 'VRFlex/**'
      - '.github/workflows/vrflex-quest-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Quest app
        working-directory: VRFlex
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VRFlex-Quest-debug-APK
          path: VRFlex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
