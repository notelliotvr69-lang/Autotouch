name: ULTRAKILL Arsenal Expansion build

on:
  workflow_dispatch:
  push:
    paths:
      - "ULTRAKILL-Arsenal-Expansion/**"
      - "UKReferences.zip"
      - "UKReferenceZ.zip"
      - "ULTRAKILL referenceZ 2.zip"
      - ".github/workflows/ultrakill-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reference archive from main if needed
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference-source
          sparse-checkout: |
            UKReferenceZ.zip
            UKReferences.zip
            ULTRAKILL referenceZ 2.zip
          sparse-checkout-cone-mode: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Prepare game reference DLLs
        shell: pwsh
        run: |
          $referenceZip = if (Test-Path "UKReferenceZ.zip") { "UKReferenceZ.zip" } elseif (Test-Path "UKReferences.zip") { "UKReferences.zip" } elseif (Test-Path "reference-source/ULTRAKILL referenceZ 2.zip") { "reference-source/ULTRAKILL referenceZ 2.zip" } elseif (Test-Path "reference-source/UKReferenceZ.zip") { "reference-source/UKReferenceZ.zip" } elseif (Test-Path "reference-source/UKReferences.zip") { "reference-source/UKReferences.zip" } else { $null }
          if (!$referenceZip) {
            throw "No supported ULTRAKILL reference archive exists in the mod branch or main branch."
          }
          Write-Host "Using reference archive: $referenceZip"
          Expand-Archive -LiteralPath $referenceZip -DestinationPath ".reference-extract" -Force
          New-Item -ItemType Directory -Force -Path ".build/ULTRAKILL_Data/Managed" | Out-Null
          New-Item -ItemType Directory -Force -Path ".build/BepInEx/core" | Out-Null

          $required = @(
            @{ Name = "Assembly-CSharp.dll"; Destination = ".build/ULTRAKILL_Data/Managed/Assembly-CSharp.dll" },
            @{ Name = "UnityEngine.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.dll" },
            @{ Name = "UnityEngine.CoreModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.CoreModule.dll" },
            @{ Name = "UnityEngine.PhysicsModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.PhysicsModule.dll" },
            @{ Name = "UnityEngine.InputLegacyModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.InputLegacyModule.dll" },
            @{ Name = "BepInEx.dll"; Destination = ".build/BepInEx/core/BepInEx.dll" },
            @{ Name = "0Harmony.dll"; Destination = ".build/BepInEx/core/0Harmony.dll" }
          )

          foreach ($file in $required) {
            $matches = @(Get-ChildItem ".reference-extract" -Recurse -File -Filter $file.Name)
            if ($matches.Count -eq 0) {
              throw "$referenceZip is missing $($file.Name). Check that the archive contains the required game and Unity DLLs."
            }
            Copy-Item -LiteralPath $matches[0].FullName -Destination $file.Destination -Force
            Write-Host "Prepared $($file.Name)"
          }

      - name: Build plugin
        run: dotnet build ULTRAKILL-Arsenal-Expansion/ArsenalExpansion.csproj --configuration Release

      - name: Package plugin
        shell: pwsh
        run: |
          $builtDll = Get-ChildItem "ULTRAKILL-Arsenal-Expansion/bin/Release" -Recurse -File -Filter "ArsenalExpansion*.dll" | Select-Object -First 1
          if (!$builtDll) {
            throw "Build output DLL not found under ULTRAKILL-Arsenal-Expansion/bin/Release."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -LiteralPath $builtDll.FullName -Destination "out/ArsenalExpansion.dll"
          Copy-Item "ULTRAKILL-Arsenal-Expansion/README.md" "out/README.md"
          Compress-Archive -Path out/* -DestinationPath ArsenalExpansion-v0.4.0-build.zip -Force

      - name: Upload compiled plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArsenalExpansion-v0.4.0-build
          path: ArsenalExpansion-v0.4.0-build.zip
