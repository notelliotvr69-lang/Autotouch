name: Deploy VRFlex website

on:
  push:
    branches: [main]
    paths:
      - 'vrflex-site/**'
      - 'VRFlex/**'
      - '.github/workflows/vrflex-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vrflex-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build Quest APK for website
        working-directory: VRFlex
        run: gradle --no-daemon assembleDebug
      - name: Copy APK into website
        run: cp VRFlex/app/build/outputs/apk/debug/app-debug.apk vrflex-site/VRFlex.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vrflex-site
      - id: deployment
        uses: actions/deploy-pages@v4
