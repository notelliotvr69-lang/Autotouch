name: Roblox OG UI

on:
  push:
    paths:
      - 'RobloxOG/**'
      - '.github/workflows/roblox-og.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RobloxOG
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper
        run: gradle wrapper --gradle-version 9.0.0

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify APK with apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release-unsigned.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxOG-release
          path: RobloxOG/app/build/outputs/apk/release/*.apk
