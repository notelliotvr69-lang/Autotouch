name: TWIN REQUIEM build validation

permissions:
  contents: read

concurrency:
  group: twin-requiem-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "TwinRequiem/**"
      - "UKReferenceZ.zip"
      - "ULTRAKILL referenceZ 3.zip"
      - "Waff1e-AtlasLib-3.0.7.zip"
      - ".github/workflows/twin-requiem-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Prepare game reference DLLs
        shell: pwsh
        run: |
          $required = @(
            @{ Name = "Assembly-CSharp.dll"; Destination = ".build/ULTRAKILL_Data/Managed/Assembly-CSharp.dll" },
            @{ Name = "UnityEngine.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.dll" },
            @{ Name = "UnityEngine.CoreModule.dll"; Destination = ".build/ULTRAKILL_Data/Managed/UnityEngine.CoreModule.dll" },
            @{ Name = "BepInEx.dll"; Destination = ".build/BepInEx/core/BepInEx.dll" },
            @{ Name = "0Harmony.dll"; Destination = ".build/BepInEx/core/0Harmony.dll" }
          )
          $archives = @("ULTRAKILL referenceZ 3.zip", "UKReferenceZ.zip") | Where-Object { Test-Path $_ }
          if ($archives.Count -eq 0) { throw "No reference archive found. Expected ULTRAKILL referenceZ 3.zip or UKReferenceZ.zip." }
          $selected = $null
          foreach ($archive in $archives) {
            $extractDir = Join-Path ".reference-extract" ([IO.Path]::GetFileNameWithoutExtension($archive))
            Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
            $allPresent = $true
            foreach ($file in $required) { if (@(Get-ChildItem $extractDir -Recurse -File -Filter $file.Name).Count -eq 0) { $allPresent = $false; break } }
            if ($allPresent) { $selected = $extractDir; Write-Host "Using reference archive: $archive"; break }
            Write-Host "Archive missing one or more required DLLs: $archive"
          }
          if ($null -eq $selected) { throw "Neither reference archive contains all required DLLs." }
          foreach ($file in $required) {
            $match = Get-ChildItem $selected -Recurse -File -Filter $file.Name | Select-Object -First 1
            $destinationDir = Split-Path $file.Destination -Parent
            New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null
            Copy-Item -LiteralPath $match.FullName -Destination $file.Destination -Force
          }
      - name: Prepare Atlas reference DLLs
        shell: pwsh
        run: |
          $archive = "Waff1e-AtlasLib-3.0.7.zip"
          if (!(Test-Path $archive)) { throw "Atlas archive missing: $archive" }
          $extractDir = ".reference-extract/Atlas"
          $destination = ".build/Atlas"
          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $destination -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir, $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $dlls = @(Get-ChildItem $extractDir -Recurse -File -Filter "*.dll")
          Write-Host "Atlas archive contents:"
          Get-ChildItem $extractDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }
          if ($dlls.Count -eq 0) { throw "Atlas ZIP contains no DLLs; inspect the archive format before building." }
          foreach ($dll in $dlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $destination $dll.Name) -Force
          }
          Write-Host "Atlas DLLs staged for compilation:"
          Get-ChildItem $destination -File -Filter "*.dll" | ForEach-Object { Write-Host $_.Name }
      - name: Compile prototype (validation only)
        run: dotnet build TwinRequiem/TwinRequiem.csproj --configuration Release
      - name: Run mechanics regression tests
        run: dotnet run --project TwinRequiem.Tests/TwinRequiem.Tests.csproj --configuration Release
      - name: Upload TWIN REQUIEM prototype DLL
        uses: actions/upload-artifact@v4
        with:
          name: TWIN-REQUIEM-prototype-DLL
          path: TwinRequiem/bin/Release/netstandard2.1/TwinRequiem.dll
          if-no-files-found: error
          retention-days: 14
