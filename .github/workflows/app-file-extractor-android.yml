name: Build App File Extractor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AppFileExtractor/**"
      - ".github/workflows/app-file-extractor-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build debug APK
        working-directory: AppFileExtractor
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppFileExtractor-debug-apk
          path: AppFileExtractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
