name: Build QuestLink APK

on:
  push:
    branches: [gh-pages]
    paths:
      - "builder/**"
      - ".github/workflows/build-questlink.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p builder --no-daemon assembleDebug --stacktrace

      - name: Publish APK into website branch
        run: |
          cp builder/app/build/outputs/apk/debug/app-debug.apk QuestLinkClient.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuestLinkClient.apk
          git commit -m "Build QuestLinkClient.apk [skip ci]" || exit 0
          git push
