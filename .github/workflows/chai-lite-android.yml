name: Build CHAI Lite Android
on:
  push:
    paths:
      - 'chai-lite/**'
      - '.github/workflows/chai-lite-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: chai-lite
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chai-lite-debug-apk
          path: chai-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
