name: QuestLink V7.8 Experimental Build

on:
  push:
    branches:
      - questlink-v7.8-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OpenVR probe DLL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
          mkdir -p questlink-pc/Assets
          x86_64-w64-mingw32-g++             -std=c++17 -O2 -shared -static-libgcc -static-libstdc++             questlink-openvr-shim/QuestLinkOpenVRShim.cpp             -o questlink-pc/Assets/QuestLinkOpenVRShim.dll
          test -f questlink-pc/Assets/QuestLinkOpenVRShim.dll

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Quest APK
        working-directory: questlink-android
        run: gradle --no-daemon assembleDebug

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build QuestLink PC
        run: dotnet publish questlink-pc/QuestLink.PC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Assemble artifacts
        shell: bash
        run: |
          mkdir -p out
          cp questlink-android/app/build/outputs/apk/debug/app-debug.apk out/QuestLinkClient-V7.8.apk
          cp questlink-pc/bin/Release/net8.0-windows/win-x64/publish/QuestLinkPC.exe out/QuestLinkPC-V7.8.exe
          cp questlink-pc/Assets/QuestLinkOpenVRShim.dll out/QuestLinkOpenVRShim-V7.8.dll
          ls -lh out

      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: QuestLink-V7.8-Experimental
          path: out/*
          if-no-files-found: error
          retention-days: 7
