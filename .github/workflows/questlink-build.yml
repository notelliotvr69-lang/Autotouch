name: QuestLink Android Build

on:
  pull_request:
    paths:
      - "questlink-android/**"
      - ".github/workflows/questlink-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build QuestLink APK
        run: gradle -p questlink-android --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -f questlink-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload QuestLink APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestLinkClient
          path: questlink-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
