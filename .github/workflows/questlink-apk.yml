name: Build QuestLink APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Android project
        shell: bash
        run: |
          mkdir -p build-work
          base64 -d questlink-apk/QuestLinkAndroid_Source_v2.b64 > build-work/questlink-source.zip
          unzip -q build-work/questlink-source.zip -d build-work
          test -f build-work/QuestLinkAndroid_V0_8/settings.gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: build-work/QuestLinkAndroid_V0_8
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="build-work/QuestLinkAndroid_V0_8/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          cp "$APK" QuestLinkClient.apk

      - name: Upload QuestLink APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestLinkClient-apk
          path: QuestLinkClient.apk
          if-no-files-found: error
          retention-days: 30
